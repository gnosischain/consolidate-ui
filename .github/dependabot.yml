version: 2
# This repo is being decommissioned (~Dec 2026). Policy: no routine version-update churn.
# Dependabot only opens PRs for actual security advisories (Dependabot security updates).
#
# `open-pull-requests-limit: 0` disables VERSION updates for the ecosystem while leaving
# SECURITY updates running (those have a separate internal limit of 10 and are unaffected).
#
# Caveats baked into this choice:
#   - Security updates ALWAYS target the default branch (main) and ignore `target-branch`,
#     so these PRs land on main, not dev.
#   - Dependabot bumps to the minimum *fixed* version, which is occasionally a major.
#   - Requires "Dependabot security updates" to be ENABLED in
#     Settings -> Code security. Without it you get alerts but no PRs.
updates:
  # JavaScript / TypeScript dependencies (pnpm)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly # scan cadence only; security PRs open as soon as a fix is available
    open-pull-requests-limit: 0 # disable version updates; security updates keep running
    labels:
      - dependencies
      - security

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
